<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe5" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="Arleu & Juliana — Uma história de amor." />
    <title>Arleu & Juliana — Uma história de amor</title>
    <link rel="preload" href="/assets/loading-casal.webp" as="image" type="image/webp" fetchpriority="high" />
    <style id="site-loader-style">
      html.site-is-loading,
      body.site-is-loading {
        overflow: hidden !important;
        overscroll-behavior: none !important;
        touch-action: none !important;
        height: 100% !important;
      }

      #site-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 26%, rgba(255,255,255,.95), rgba(255,255,255,0) 31%),
          linear-gradient(180deg, #fbf7f9 0%, #f7f1f5 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity .48s ease, visibility .48s ease;
      }

      #site-loader.site-loader--done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .site-loader__inner {
        width: min(90vw, 420px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 9px;
        text-align: center;
      }

      .site-loader__art {
        display: block;
        width: min(62vw, 250px);
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 18px 34px rgba(114,76,93,.12));
        animation: site-loader-float 2.5s ease-in-out infinite;
      }

      .site-loader__label {
        margin: 4px 0 0;
        color: #724c5d;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(15px, 1.6vw, 17px);
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .site-loader__percent {
        margin: 0;
        color: #9c6075;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(21px, 3vw, 29px);
        line-height: 1;
        font-weight: 700;
      }

      .site-loader__bar {
        width: 140px;
        max-width: 56vw;
        height: 6px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(156,96,117,.15);
        box-shadow: inset 0 0 0 1px rgba(156,96,117,.07);
      }

      .site-loader__bar-fill {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: #9c6075;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform .16s ease-out;
      }

      @keyframes site-loader-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-6px) scale(1.01); }
      }

      @media (max-width: 640px) {
        .site-loader__art { width: min(72vw, 225px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .site-loader__art { animation: none; }
      }
    </style>
  </head>
  <body class="site-is-loading">
    <div id="site-loader" role="status" aria-live="polite" aria-label="Carregando">
      <div class="site-loader__inner">
        <img class="site-loader__art" src="/assets/loading-casal.webp" alt="" width="640" height="640" fetchpriority="high" />
        <p class="site-loader__label">Carregando...</p>
        <p class="site-loader__percent" data-loader-percent>0%</p>
        <span class="site-loader__bar" aria-hidden="true"><i class="site-loader__bar-fill" data-loader-bar></i></span>
      </div>
    </div>

    <div id="app"></div>

    <script>
      (() => {
        const loader = document.getElementById('site-loader');
        const percentNode = loader?.querySelector('[data-loader-percent]');
        const barNode = loader?.querySelector('[data-loader-bar]');
        if (!loader) return;

        document.documentElement.classList.add('site-is-loading');

        // Enquanto o loading estiver visível, a história fica fisicamente presa
        // no topo. Assim nenhum wheel/swipe/tecla consegue "andar por baixo".
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        } catch (_) {}

        let lockingScroll = true;
        const forceTop = () => {
          if (!lockingScroll) return;
          if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
        };
        const blockScrollInput = (event) => {
          if (!lockingScroll) return;
          event.preventDefault();
          forceTop();
        };
        const blockScrollKey = (event) => {
          if (!lockingScroll) return;
          if (!['ArrowDown','ArrowUp','PageDown','PageUp',' ','Spacebar','Home','End'].includes(event.key)) return;
          event.preventDefault();
          forceTop();
        };

        window.scrollTo(0, 0);
        window.addEventListener('scroll', forceTop, { passive: true, capture: true });
        window.addEventListener('wheel', blockScrollInput, { passive: false, capture: true });
        window.addEventListener('touchmove', blockScrollInput, { passive: false, capture: true });
        window.addEventListener('keydown', blockScrollKey, { capture: true });

        // Só o que realmente precisa estar pronto antes da pessoa começar:
        // Hero completa + "Nosso primeiro beijo".
        const heroAssets = [
          '/assets/jujucarnaval02.webp',
          '/assets/jujuformatura.webp',
          '/assets/jujucasamento.webp',
          '/assets/hero-coracoes.webp'
        ];

        // Só o frame inicial de "Nosso primeiro beijo" bloqueia a abertura.
        // As poses seguintes são aquecidas já com a Hero visível.
        const beijoCoreAssets = [
          '/assets/festa-show-neon.webp',
          '/assets/encontro-01-juntos.webp'
        ];

        const beijoWarmAssets = [
          '/assets/encontro-02-pergunta.webp',
          '/assets/encontro-03-beijo.webp',
          '/assets/encontro-04-abraco.webp'
        ];

        const criticalAssets = [...heroAssets, ...beijoCoreAssets];

        const startedAt = performance.now();
        const minimumVisibleMs = 350;
        const total = criticalAssets.length + 1; // + app montado
        let completed = 0;
        let finished = false;
        let failedAsset = null;

        const paint = () => {
          const raw = Math.round((completed / total) * 100);
          const value = finished ? 100 : Math.min(99, raw);
          if (percentNode) percentNode.textContent = `${value}%`;
          if (barNode) barNode.style.transform = `scaleX(${value / 100})`;
        };

        const markComplete = () => {
          completed = Math.min(total, completed + 1);
          paint();
        };

        const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

        const loadAndDecode = (src, priority = 'auto') => new Promise((resolve, reject) => {
          const image = new Image();
          let settled = false;

          const fail = () => {
            if (settled) return;
            settled = true;
            reject(new Error(src));
          };

          const finish = async () => {
            if (settled) return;
            try {
              if (!image.naturalWidth) return fail();
              if (typeof image.decode === 'function') {
                try { await image.decode(); } catch (_) {}
              }
              settled = true;
              markComplete();
              resolve(src);
            } catch (_) {
              fail();
            }
          };

          image.decoding = 'async';
          try { image.fetchPriority = priority; } catch (_) {}
          image.addEventListener('load', finish, { once: true });
          image.addEventListener('error', fail, { once: true });
          image.src = src;

          if (image.complete) {
            if (image.naturalWidth) finish();
            else fail();
          }
        });

        const waitForApp = new Promise((resolve) => {
          const app = document.getElementById('app');
          if (!app || app.childElementCount > 0) {
            markComplete();
            resolve();
            return;
          }

          const observer = new MutationObserver(() => {
            if (app.childElementCount <= 0) return;
            observer.disconnect();
            markComplete();
            resolve();
          });
          observer.observe(app, { childList: true });
        });

        // Hero recebe prioridade alta. Fundo + primeira pose do beijo carregam
        // junto. As outras três poses não seguram a tela inicial.
        const assetJobs = [
          ...heroAssets.map((src) => loadAndDecode(src, 'high')),
          ...beijoCoreAssets.map((src) => loadAndDecode(src, 'auto'))
        ];

        const warmImage = (src) => new Promise((resolve) => {
          const image = new Image();
          image.decoding = 'async';
          try { image.fetchPriority = 'low'; } catch (_) {}
          image.onload = () => resolve(src);
          image.onerror = () => resolve(src);
          image.src = src;
          if (image.complete) resolve(src);
        });

        const warmBeijoRest = async () => {
          // Um por vez: evita travar a animação do loader / Hero.
          for (const src of beijoWarmAssets) {
            if ('requestIdleCallback' in window) {
              await new Promise((resolve) =>
                requestIdleCallback(() => resolve(), { timeout: 700 })
              );
            } else {
              await wait(120);
            }
            await warmImage(src);
          }
        };

        const reveal = async () => {
          if (finished) return;
          finished = true;

          const elapsed = performance.now() - startedAt;
          if (elapsed < minimumVisibleMs) await wait(minimumVisibleMs - elapsed);

          if (percentNode) percentNode.textContent = '100%';
          if (barNode) barNode.style.transform = 'scaleX(1)';

          // Um único ciclo de pintura é suficiente porque os arquivos já foram
          // baixados/decodificados e o app já existe no DOM.
          await new Promise((resolve) =>
            requestAnimationFrame(() => requestAnimationFrame(resolve))
          );

          // As poses 02-04 começam a carregar agora, em segundo plano.
          void warmBeijoRest();

          // Garante que a abertura SEMPRE começa na Hero.
          window.scrollTo(0, 0);

          // Sinal único para o runtime: a partir daqui ele pode preparar/tentar
          // iniciar a trilha. Se o navegador bloquear autoplay com som, o clique
          // em "Começar" vira o fallback garantido.
          window.__siteLoaderComplete = true;
          document.dispatchEvent(new CustomEvent('site:loader-complete'));

          loader.classList.add('site-loader--done');

          window.setTimeout(() => {
            lockingScroll = false;
            window.removeEventListener('scroll', forceTop, { capture: true });
            window.removeEventListener('wheel', blockScrollInput, { capture: true });
            window.removeEventListener('touchmove', blockScrollInput, { capture: true });
            window.removeEventListener('keydown', blockScrollKey, { capture: true });
            document.documentElement.classList.remove('site-is-loading');
            document.body.classList.remove('site-is-loading');
            window.scrollTo(0, 0);
            loader.remove();
          }, 520);
        };

        const showLoadProblem = (error) => {
          failedAsset = error;
          console.error('[loader] Asset crítico indisponível:', error);
          if (percentNode) percentNode.textContent = '!';
          const label = loader.querySelector('.site-loader__label');
          const missing = String(error?.message || '')
            .split('/')
            .filter(Boolean)
            .pop();
          if (label) {
            label.textContent = missing
              ? `Arquivo ausente: ${missing}`
              : 'Falha ao carregar uma imagem';
          }
        };

        paint();

        Promise.all([...assetJobs, waitForApp])
          .then(reveal)
          .catch(showLoadProblem);
      })();
    </script>
    <script src="/analytics-config.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
