<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe5" />
    <meta name="description" content="Arleu & Juliana — Uma história de amor." />
    <title>Arleu & Juliana — Uma história de amor</title>
    <link rel="preload" href="/assets/loading-casal.webp" as="image" type="image/webp" fetchpriority="high" />
    <style id="site-loader-style">
      html.site-is-loading,
      body.site-is-loading {
        overflow: hidden !important;
      }

      #site-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 26%, rgba(255,255,255,.95), rgba(255,255,255,0) 31%),
          linear-gradient(180deg, #fbf7f9 0%, #f7f1f5 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity .48s ease, visibility .48s ease;
      }

      #site-loader.site-loader--done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .site-loader__inner {
        width: min(90vw, 420px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 9px;
        text-align: center;
      }

      .site-loader__art {
        display: block;
        width: min(62vw, 250px);
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 18px 34px rgba(114,76,93,.12));
        animation: site-loader-float 2.5s ease-in-out infinite;
      }

      .site-loader__label {
        margin: 4px 0 0;
        color: #724c5d;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(15px, 1.6vw, 17px);
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .site-loader__percent {
        margin: 0;
        color: #9c6075;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(21px, 3vw, 29px);
        line-height: 1;
        font-weight: 700;
      }

      .site-loader__bar {
        width: 140px;
        max-width: 56vw;
        height: 6px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(156,96,117,.15);
        box-shadow: inset 0 0 0 1px rgba(156,96,117,.07);
      }

      .site-loader__bar-fill {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: #9c6075;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform .16s ease-out;
      }

      @keyframes site-loader-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-6px) scale(1.01); }
      }

      @media (max-width: 640px) {
        .site-loader__art { width: min(72vw, 225px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .site-loader__art { animation: none; }
      }
    </style>
  </head>
  <body class="site-is-loading">
    <div id="site-loader" role="status" aria-live="polite" aria-label="Carregando">
      <div class="site-loader__inner">
        <img class="site-loader__art" src="/assets/loading-casal.webp" alt="" width="640" height="640" fetchpriority="high" />
        <p class="site-loader__label">Carregando...</p>
        <p class="site-loader__percent" data-loader-percent>0%</p>
        <span class="site-loader__bar" aria-hidden="true"><i class="site-loader__bar-fill" data-loader-bar></i></span>
      </div>
    </div>

    <div id="app"></div>

    <script>
      (() => {
        const loader = document.getElementById('site-loader');
        const percentNode = loader?.querySelector('[data-loader-percent]');
        const barNode = loader?.querySelector('[data-loader-bar]');
        if (!loader) return;

        document.documentElement.classList.add('site-is-loading');

        // Tudo que aparece na Hero e em "Nosso primeiro beijo".
        // O site so sera revelado quando estes arquivos tiverem sido
        // BAIXADOS E DECODIFICADOS pelo navegador.
        const criticalAssets = [
          '/assets/loading-casal.webp',
          '/assets/jujucarnaval02.jpeg',
          '/assets/jujuformatura.jpeg',
          '/assets/jujucasamento.jpg',
          '/assets/hero-coracoes.jpg',
          '/assets/festa-show-neon.png',
          '/assets/encontro-01-juntos.png',
          '/assets/encontro-02-pergunta.png',
          '/assets/encontro-03-beijo.png',
          '/assets/encontro-04-abraco.png'
        ];

        const startedAt = performance.now();
        const minimumVisibleMs = 700;
        const EXTRA_STEPS = 3; // app montado + fontes + imagens DOM prontas
        const total = criticalAssets.length + EXTRA_STEPS;
        let completed = 0;
        let finished = false;

        const paint = () => {
          // Nunca mostramos 100% antes da liberacao real.
          const raw = Math.round((completed / total) * 100);
          const value = finished ? 100 : Math.min(99, raw);
          if (percentNode) percentNode.textContent = `${value}%`;
          if (barNode) barNode.style.transform = `scaleX(${value / 100})`;
        };

        const markComplete = () => {
          completed = Math.min(total, completed + 1);
          paint();
        };

        const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

        const loadAndDecode = async (src, attempt = 1) => {
          try {
            const image = new Image();
            image.decoding = 'async';
            image.src = src;

            if (!image.complete || !image.naturalWidth) {
              await new Promise((resolve, reject) => {
                image.addEventListener('load', resolve, { once: true });
                image.addEventListener('error', () => reject(new Error(`Falha ao carregar ${src}`)), { once: true });
              });
            }

            if (!image.naturalWidth) throw new Error(`Imagem invalida: ${src}`);

            // onload significa que os bytes chegaram. decode() garante que a
            // imagem tambem esta pronta para ser pintada na tela.
            if (typeof image.decode === 'function') {
              await image.decode();
            }

            markComplete();
            return src;
          } catch (error) {
            if (attempt < 4) {
              await wait(450 * attempt);
              return loadAndDecode(src, attempt + 1);
            }

            // Nao fingimos 100% e nao abrimos um site incompleto.
            console.error('[loader] Asset critico nao ficou pronto:', src, error);
            return new Promise(() => {});
          }
        };

        const waitForApp = new Promise((resolve) => {
          const app = document.getElementById('app');
          if (!app) {
            markComplete();
            resolve();
            return;
          }

          const ready = () => app.childElementCount > 0;
          if (ready()) {
            markComplete();
            resolve();
            return;
          }

          const observer = new MutationObserver(() => {
            if (!ready()) return;
            observer.disconnect();
            markComplete();
            resolve();
          });
          observer.observe(app, { childList: true });
        });

        const waitForFonts = (async () => {
          if (document.fonts?.ready) await document.fonts.ready;
          markComplete();
        })();

        const waitForCriticalDomImages = (async () => {
          await waitForApp;

          // Espera tambem as tags <img> reais do primeiro beijo. Mesmo com o
          // arquivo em cache, isso evita revelar a pagina um frame antes do paint.
          const images = [
            ...document.querySelectorAll('#inicio img, #ato-1 img')
          ];

          await Promise.all(images.map(async (image) => {
            if (!image.complete || !image.naturalWidth) {
              await new Promise((resolve, reject) => {
                image.addEventListener('load', resolve, { once: true });
                image.addEventListener('error', reject, { once: true });
              });
            }
            if (typeof image.decode === 'function') {
              try { await image.decode(); } catch (_) {}
            }
          }));

          // Garante dois paints completos antes de liberar o overlay.
          await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          markComplete();
        })();

        const reveal = async () => {
          if (finished) return;
          finished = true;

          const elapsed = performance.now() - startedAt;
          if (elapsed < minimumVisibleMs) await wait(minimumVisibleMs - elapsed);

          if (percentNode) percentNode.textContent = '100%';
          if (barNode) barNode.style.transform = 'scaleX(1)';

          // Deixa o 100% ser realmente pintado antes do fade.
          await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

          loader.classList.add('site-loader--done');
          document.documentElement.classList.remove('site-is-loading');
          document.body.classList.remove('site-is-loading');
          window.setTimeout(() => loader.remove(), 560);
        };

        paint();

        Promise.all([
          ...criticalAssets.map((src) => loadAndDecode(src)),
          waitForApp,
          waitForFonts,
          waitForCriticalDomImages
        ]).then(reveal);
      })();
    </script>
    <script src="/analytics-config.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
